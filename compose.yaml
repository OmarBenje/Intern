services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intern}
      POSTGRES_USER: ${POSTGRES_USER:-intern_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - intern_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    ports:
      - "127.0.0.1:8000:8000"
    environment: &app_environment
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-intern-key-never-use-in-production-000000000}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      POSTGRES_DB: ${POSTGRES_DB:-intern}
      POSTGRES_USER: ${POSTGRES_USER:-intern_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PRIVATE_STORAGE_BACKEND: ${PRIVATE_STORAGE_BACKEND:-local}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      GREENHOUSE_API_KEYS: "${GREENHOUSE_API_KEYS:-{}}"
    volumes:
      - intern_media:/app/.private-media
      - intern_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    command: [".venv/bin/python", "app/manage.py", "run_worker"]
    environment: *app_environment
    volumes:
      - intern_media:/app/.private-media
    depends_on:
      db:
        condition: service_healthy
  catalogue-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    command: [".venv/bin/python", "app/manage.py", "run_catalogue_worker", "--imports-only", "--limit", "20", "--poll-interval", "2"]
    environment: *app_environment
    volumes:
      - intern_media:/app/.private-media
    depends_on:
      db:
        condition: service_healthy
  catalogue-maintenance:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    volumes:
      - intern_media:/app/.private-media
    command: [".venv/bin/python", "app/manage.py", "run_catalogue_worker", "--maintenance-only", "--limit", "5", "--poll-interval", "60"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy

  jobspy-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    command: [".venv/bin/python", "app/manage.py", "run_jobspy_worker", "--poll-interval", "30", "--limit", "1"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy

  eures-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    command: [".venv/bin/python", "app/manage.py", "run_eures_worker", "--poll-interval", "30", "--limit", "1"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy

  wttj-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    command: [".venv/bin/python", "app/manage.py", "run_wttj_worker", "--poll-interval", "30", "--limit", "1"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy

  jobtech-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    command: [".venv/bin/python", "app/manage.py", "run_jobtech_worker", "--poll-interval", "30", "--limit", "1"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy

  bundesagentur-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    command: [".venv/bin/python", "app/manage.py", "run_bundesagentur_worker", "--poll-interval", "30", "--limit", "1"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy

  nav-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    command: [".venv/bin/python", "app/manage.py", "run_nav_worker", "--poll-interval", "10", "--limit", "1"]
    environment:
      <<: *app_environment
      NAV_FEED_TOKEN: ${NAV_FEED_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  ats-probe-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [app]
    restart: unless-stopped
    command: [".venv/bin/python", "app/manage.py", "run_ats_probe_worker", "--poll-interval", "60", "--limit", "1"]
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy

volumes:
  intern_pgdata:
  intern_media:
  intern_static:
