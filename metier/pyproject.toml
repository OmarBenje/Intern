[project]
name = "intern"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "django>=6.1.1,<6.2",
    "djangorestframework>=3.18.1,<3.19",
    "djangorestframework-stubs>=3.18.1",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6,<7",
    "python-jobspy",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.uv.sources]
python-jobspy = { git = "https://github.com/speedyapply/JobSpy", rev = "7f0ff3ab25a4a4cd204af421cf6378ede3da5569" }
